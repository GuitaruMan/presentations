<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교육과정 - My Presentations</title>
<style>
  :root { --bg: #f5f6f8; --card: #ffffff; --ink: #1c2230; --ink-soft: #5b6270; --accent: #3a5ba0; --shadow: rgba(28, 34, 48, 0.10); }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161c; --card: #1f232c; --ink: #eceef2; --ink-soft: #a3aab8; --accent: #7fa2e0; --shadow: rgba(0,0,0,0.4); } }
  :root[data-theme="dark"] { --bg: #14161c; --card: #1f232c; --ink: #eceef2; --ink-soft: #a3aab8; --accent: #7fa2e0; --shadow: rgba(0,0,0,0.4); }
  :root[data-theme="light"] { --bg: #f5f6f8; --card: #ffffff; --ink: #1c2230; --ink-soft: #5b6270; --accent: #3a5ba0; --shadow: rgba(28, 34, 48, 0.10); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; display: flex; flex-direction: column; align-items: center; padding: 6vh 5vw 4vh; }
  .top { width: 100%; max-width: 700px; margin-bottom: 1.5rem; display: flex; justify-content: space-between; }
  a.back { color: var(--ink-soft); text-decoration: none; font-size: 0.9rem; }
  a.back:hover { color: var(--accent); }
  h1 { font-size: 1.6rem; margin: 0.5rem 0 2.5rem; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1.5rem; width: 100%; max-width: 700px;
  }
  a.card {
    background: var(--card); border-radius: 16px; padding: 1.8rem 1.2rem; text-align: center;
    text-decoration: none; color: var(--ink); box-shadow: 0 4px 16px var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    display: flex; flex-direction: column; gap: 0.5rem; align-items: center;
  }
  a.card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px var(--shadow); }
  .icon2 { font-size: 1.8rem; }
  .label { font-size: 1.05rem; font-weight: 600; }
  .updated { font-size: 0.78rem; color: var(--ink-soft); }
  a.card.admin { border: 1.5px dashed var(--ink-soft); box-shadow: none; }
  a.card.admin:hover { border-color: var(--accent); }
  .sect { width: 100%; max-width: 700px; margin: 2.4rem 0 0.8rem; font-size: 0.85rem; color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="top">
        <a class="back" href="../index.html">&larr; 홈으로</a>
  </div>
  <h1>📘 교육과정</h1>

  <div class="grid">
    <a class="card" href="교육과정/2028과목선택/index.html">
      <div class="icon2">🧭</div>
      <div class="label">2028 과목 선택 안내</div>
      <div class="updated" data-date="./work/교육과정/2028과목선택/index.html"></div>
    </a>
  </div>

  <div class="sect">관리자용</div>
  <div class="grid">
    <a class="card admin" href="교육과정/2028과목선택/admin.html">
      <div class="icon2">⚙️</div>
      <div class="label">개설 현황 관리</div>
      <div class="updated" data-date="./work/교육과정/2028과목선택/admin.html"></div>
    </a>
  </div>

<script>
/* 업데이트 날짜 — dates.json 은 GitHub Actions 가 각 파일의
   마지막 커밋일로 자동 생성한다. 손으로 적으면 고치는 걸 잊는다. */
fetch('../dates.json?v=' + Date.now())
  .then(function (r) { return r.json(); })
  .then(function (d) {
    document.querySelectorAll('[data-date]').forEach(function (el) {
      var v = d[el.dataset.date];
      if (!v) { el.remove(); return; }
      var p = v.split('-');
      el.textContent = '업데이트: ' + p[0] + '. ' + Number(p[1]) + '. ' + Number(p[2]) + '.';
    });
  })
  .catch(function () {
    document.querySelectorAll('[data-date]').forEach(function (el) { el.remove(); });
  });
</script>
</body>
</html>
